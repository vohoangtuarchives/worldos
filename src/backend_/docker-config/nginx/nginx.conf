user www-data;
# ✅ OPTIMIZE: Limit worker processes to reduce memory usage
# In container, 1-2 workers is usually enough
worker_processes 1;
pid /var/run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    # ✅ OPTIMIZE: Reduce connections per worker (container doesn't need 1024)
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ✅ OPTIMIZE: Disable access log in container (Traefik already logs)
    # Uncomment if you need nginx access logs
    # access_log /var/log/nginx/access.log main;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 2000M;

    # ✅ OPTIMIZE: Enable gzip but reduce compression level for less CPU
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    include /etc/nginx/conf.d/*.conf;
}
