services:
  kernel:
    build:
      context: ./kernel
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://worldos:worldos@postgres:5432/worldos
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worldos
      POSTGRES_PASSWORD: worldos
      POSTGRES_DB: worldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldos -d worldos"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - worldos_postgres:/var/lib/postgresql/data
volumes:
  worldos_postgres:
