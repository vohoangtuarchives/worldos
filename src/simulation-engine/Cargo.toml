[package]
name = "simulation-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
prost = "0.13"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
ndarray = "0.15"

[build-dependencies]
tonic-build = "0.12"
