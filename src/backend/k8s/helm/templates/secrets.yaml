apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worldos.fullname" . }}-secrets
type: Opaque
stringData:
  world_service_target: {{ .Values.gateway.worldServiceTarget | default "world-simulation:50051" }}
  story_service_target: {{ .Values.gateway.storyServiceTarget | default "story-service:50051" }}
  material_service_target: {{ .Values.gateway.materialServiceTarget | default "material-service:50051" }}