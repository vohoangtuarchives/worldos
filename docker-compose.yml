# Local Development Configuration
# Usage: docker-compose up -d

services:
  db:
    image: postgres:17-alpine
    container_name: ${APP_NAME}_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXPOSE:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE:-16379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18080}:80"
      - "16001:6001"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=${DB_HOST:-db}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - SIMULATION_ENGINE_GRPC_HOST=simulation-engine:50051
    volumes:
      - ./src/backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    # Command is already set in Dockerfile CMD
    # command: /usr/local/bin/start.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulation-engine:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    container_name: ${APP_NAME}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - INTERNAL_API_URL=http://backend
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./src/frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - app_network

  simulation-engine:
    build:
      context: ./src/simulation-engine
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-worldos}_simulation_engine
    restart: unless-stopped
    ports:
      - "${SIMULATION_ENGINE_PORT:-50051}:50051"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_HOST=${DB_HOST:-db}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./src/simulation-engine:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/50051 && echo OK' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  adminer:
    image: adminer:latest
    container_name: ${APP_NAME}_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-18081}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DESIGN=dracula
    depends_on:
      - db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
    name: worldos_app_network
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres_data:
  redis_data:
