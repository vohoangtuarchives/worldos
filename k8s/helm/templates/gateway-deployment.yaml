apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worldos.fullname" . }}-gateway
  labels:
    {{- include "worldos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WORLD_SERVICE_TARGET
              valueFrom:
                secretKeyRef:
                  name: {{ include "worldos.fullname" . }}-secrets
                  key: world_service_target
            - name: STORY_SERVICE_TARGET
              valueFrom:
                secretKeyRef:
                  name: {{ include "worldos.fullname" . }}-secrets
                  key: story_service_target
            - name: MATERIAL_SERVICE_TARGET
              valueFrom:
                secretKeyRef:
                  name: {{ include "worldos.fullname" . }}-secrets
                  key: material_service_target
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
